<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><title>Productivity Assessment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark-teal stage matching the Mind.OS deck. Intro, ten situations one per screen, then a result with a percentage ring, five area bars and one small experiment. */
:root{
  --bg:#04100E; --bg2:#0B2D27; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.09); --line:rgba(255,255,255,.15);
  --fg:#EAF4EE; --mute:#9DB8AC; --brand:#3DCD58; --ink:#04100E;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(1200px 600px at 85% 0%,var(--bg2),transparent 70%),var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.12}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kick{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3.5vw,30px)}
.primary{background:var(--brand);color:var(--ink);border:0;border-radius:12px;padding:13px 28px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 4px}
.link.m{color:var(--mute);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.h3s{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}

/* intro */
.intro h1{font-size:clamp(36px,7vw,58px);margin:10px 0 16px}
.statement{font-size:clamp(17px,2.4vw,20px);max-width:56ch;margin-bottom:20px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.facts span{font:500 12px var(--mono);border:1px solid var(--line);border-radius:99px;padding:5px 10px;color:var(--mute)}
.tiny{font-size:12.5px;color:var(--mute);margin-top:14px}
.namebox{margin:0 0 18px;max-width:360px}
.namebox label{display:block;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.namebox input{width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);font:inherit}
.namebox input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* questions */
.qwrap{max-width:760px;margin:0 auto}
.pmeta{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--mute);margin-bottom:8px;letter-spacing:.04em}
.prog{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .25s}
.scene{font:600 clamp(21px,3.6vw,28px)/1.3 var(--display);margin:4px 0 20px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opts button{background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;text-align:left;font-size:16px;line-height:1.4;transition:background .15s,border-color .15s}
.opts button:hover{background:var(--card2);border-color:var(--brand)}
.opts button.on{background:var(--brand);border-color:var(--brand);color:var(--ink);font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:6px}
.keys{font:400 11px var(--mono);color:var(--mute)}
@media(hover:none){.keys{display:none}}

/* result */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;margin-bottom:14px}
.rtitle{font-size:clamp(26px,4.5vw,38px);margin:4px 0 16px}
.top{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center}
@media(max-width:600px){.top{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.ringwrap{position:relative;width:180px;height:180px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.pct b{font:700 44px/1 var(--display)}
.pct small{font:500 11px var(--mono);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;display:block}
.ring-fg{stroke-dasharray:339.29;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.band{display:inline-block;font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:6px 11px;background:rgba(61,205,88,.18);color:#8DE9A0;margin-bottom:10px}
.top h2{font-size:28px;margin-bottom:6px}
.why{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}
.why p{font-size:17px;line-height:1.65;max-width:68ch}
.areas{display:grid;gap:14px;margin-top:6px}
.area{display:grid;grid-template-columns:200px minmax(0,1fr) 110px;gap:12px;align-items:center}
@media(max-width:600px){.area{grid-template-columns:minmax(0,1fr) 100px;}.area .trk{grid-column:1 / -1;order:3}}
.area .nm{font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.trk{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.trk b{display:block;height:100%;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.area .bd{font:600 12px var(--mono);text-align:right;color:var(--mute);letter-spacing:.04em}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media(max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.stand{border-left:4px solid var(--c);background:var(--card2);border-radius:12px;padding:14px 16px}
.stand .h3s{margin-bottom:4px}
.stand p{font-size:18px;font-family:var(--display);font-weight:600}
.exp{background:rgba(61,205,88,.1);border:1px solid rgba(61,205,88,.4);border-radius:12px;padding:14px 16px;margin-top:10px}
.exp b{font-family:var(--display);font-size:17px;display:block;margin-bottom:2px}
.foot{font-size:12.5px;color:var(--mute);margin-top:26px;border-top:1px solid var(--line);padding-top:12px;max-width:80ch}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.ring-fg,.trk b,.prog i{transition:none}}
@media print{
  :root{--fg:#10241B;--mute:#4F6258;--line:#C9D4CC;--card:#fff;--card2:#fff;--brand:#1E7A36}
  body{background:#fff;color:#10241B;padding-block:0}
  .noprint{display:none!important}
}
</style>

<div class="wrap"><div id="app"></div></div>

<script>
/*CORE*/
var AREAS=[
 {k:'f',name:'Focus',hex:'#3FB6E8',exp:'Pick one 45-minute block tomorrow. Mute chat and email notifications, and note what you finish.'},
 {k:'e',name:'Energy and rhythm',hex:'#F2C230',exp:'For three days, notice when you feel sharpest at work, and put your most demanding task in that window.'},
 {k:'w',name:'Workload and saying no',hex:'#FF8A3D',exp:'Before saying yes this week, pause and ask: “What would I move or drop to fit this?”'},
 {k:'b',name:'Work–life boundaries',hex:'#9B7BFF',exp:'Choose one clear end-of-work signal, such as a closing note or shutting the laptop, and use it for three days.'},
 {k:'p',name:'Progress and satisfaction',hex:'#3DCD58',exp:'At the end of each day, write down one thing you moved forward and one thing to start with tomorrow.'}
];
var Q=[
 {id:'f1',a:'f',q:'You have a report that needs real concentration. Your chat and email are open. What do you usually do?',o:[
  ['Close or mute them for a set block, then check them afterwards',3],['Keep them open but only look at the important ones',2],['Check them every few minutes in case something urgent comes in',1],['Reply as things arrive, and work on the report in between',0]]},
 {id:'b1',a:'b',q:'It is the end of your working day and a non-urgent message arrives. What do you usually do?',o:[
  ['Leave it until my next working period, unless it is truly urgent',3],['Read it now, and reply the next day',2],['Reply straight away, since it only takes a minute',1],['Start working on it, even if it takes up my evening',0]]},
 {id:'w1',a:'w',q:'A colleague asks for help with something new when your week is already full. What are you most likely to do?',o:[
  ['Check what it would replace, then agree, suggest another date, or say not now',3],['Say yes and fit it in around my other work',2],['Say yes, and work out later how it fits',1],['Say yes straight away without thinking about my other work',0]]},
 {id:'p1',a:'p',q:'At the end of a typical working day, how do you usually feel about what you got done?',o:[
  ['I can name something meaningful that I moved forward',3],['I did a lot, but I am not sure it was the right things',2],['I stayed busy, but cannot say what progressed',1],['I rarely feel that I got anywhere',0]]},
 {id:'e1',a:'e',q:'You notice that some parts of your working day feel sharper than others. How do you plan around that?',o:[
  ['I put my most demanding work in my best hours when I can',3],['I sometimes do, but meetings and requests usually decide',2],['I have noticed it, but I do not plan around it',1],['I have not thought about it',0]]},
 {id:'e2',a:'e',q:'It is mid-afternoon, after several hours of meetings and screens. What do you usually do?',o:[
  ['Step away from the screen for a few minutes, then start the next task',3],['Take a short pause at my desk',2],['Switch to something easier and keep going',1],['Keep going until the day ends',0]]},
 {id:'f2',a:'f',q:'Over a typical working day, how often do you get a stretch of 45 minutes or more without switching tasks?',o:[
  ['Most days',3],['A few days a week',2],['Occasionally',1],['Rarely or never',0]]},
 {id:'p2',a:'p',q:'Think of the most important thing for this week. By Thursday, what is usually true of it?',o:[
  ['It is moving, because I gave it time early in the week',3],['I have started it, but other work keeps pushing it back',2],['It is still waiting, and I plan to get to it',1],['I have not decided what is most important this week',0]]},
 {id:'w2',a:'w',q:'When you plan a working day, how does your plan usually compare with what actually fits?',o:[
  ['I plan roughly what fits and leave space for surprises',3],['I plan a little more than fits, and move the rest',2],['I plan a full list and rarely finish it',1],['I do not plan how much a day can hold',0]]},
 {id:'b2',a:'b',q:'How clear is the line between your work time and your personal time in a typical week?',o:[
  ['Clear: I have a usual end to the day and mostly keep to it',3],['Fairly clear, with occasional exceptions',2],['Blurry: work often moves into my personal time',1],['There is hardly a line',0]]}
];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bandOverall(p){return p>=70?'Strong':p>=40?'Steady':'Building'}
function bandArea(pts){return pts>=5?'Strong':pts>=3?'Steady':'Building'}
var BANDTXT={
 Building:'Your reported habits leave a lot of room to protect your time and energy. A few small changes could make a real difference.',
 Steady:'You have a solid base, with some gaps that are worth a closer look.',
 Strong:'Your reported habits support your productivity well. Keep what works, and look at the area with the most room.'
};
/* each answer is worth 0 to 3 points; 10 questions give a maximum of 30; percentage = points / 30 x 100 */
function score(ans){
  var total=0,areas=AREAS.map(function(a){return {a:a,pts:0}});
  Q.forEach(function(q){var v=ans[q.id];if(typeof v==='number'){total+=v;areas.filter(function(x){return x.a.k===q.a})[0].pts+=v}});
  var pct=Math.round(total/30*100);
  areas.forEach(function(x){x.band=bandArea(x.pts)});
  var mx=Math.max.apply(null,areas.map(function(x){return x.pts})),mn=Math.min.apply(null,areas.map(function(x){return x.pts}));
  return {total:total,pct:pct,band:bandOverall(pct),areas:areas,balanced:mx===mn,
    strong:areas.filter(function(x){return x.pts===mx}),room:areas.filter(function(x){return x.pts===mn})};
}
function allAnswered(ans){return Q.every(function(q){return typeof ans[q.id]==='number'})}
/* the explanation paragraph is built only from the score and the five area bands, so identical answers always give identical text */
var AREA_TXT={
 f:{Strong:'you usually protect blocks of uninterrupted time and keep notifications from breaking your concentration',Steady:'you get some uninterrupted time, but notifications and switching tasks often break your concentration',Building:'your attention is often split by notifications and by switching between tasks'},
 e:{Strong:'you tend to match demanding work to your sharpest hours and take real breaks',Steady:'you sometimes plan around your energy, but meetings and requests often decide how your day goes',Building:'your day is mostly shaped by demands rather than by your energy, with few real breaks'},
 w:{Strong:'you check new requests against what is already on your plate and plan what realistically fits',Steady:'you usually fit new requests in around other work, and plan a little more than a day can hold',Building:'you tend to agree to new requests without checking them against your other work, and plan more than fits'},
 b:{Strong:'you keep a clear line between work time and personal time',Steady:'the line between work and personal time is fairly clear, with some exceptions',Building:'work often moves into your personal time'},
 p:{Strong:'you usually end the day able to name what you moved forward, and you give important work time early in the week',Steady:'you get a lot done, but you are not always sure it was the right work',Building:'you often end the day unsure what progressed, and important work tends to wait'}
};
function joinAnd(a){return a.length>1?a.slice(0,-1).join(', ')+' plus '+a[a.length-1]:a[0]}
function explain(ans){
  var r=score(ans),s='You scored '+r.pct+'%, which is '+r.total+' of the 30 possible points, and falls in the '+r.band+' range. '+(r.balanced&&r.band==='Strong'?'Your reported habits support your productivity well, and keep what works.':BANDTXT[r.band]);
  function line(x){return ' In '+x.a.name+', '+AREA_TXT[x.a.k][x.band]+'.'}
  if(r.balanced){
    s+=' Your five areas score alike, so no single area stands out. Across focus, energy, workload, boundaries and progress, your reported habits sit in the '+r.areas[0].band+' range.';
  }else{
    var st=r.strong.slice(0,2),rm=r.room.slice(0,2),sn=joinAnd(st.map(function(x){return x.a.name}));
    s+=(st[0].band==='Building'?' Your highest-scoring ':' Your strongest ')+(st.length>1?'areas are ':'area is ')+sn+'.'+st.map(line).join('');
    var rn=joinAnd(rm.map(function(x){return x.a.name}));
    s+=(rm[0].band==='Strong'?' Your lowest '+(rm.length>1?'areas are ':'area is ')+rn+', though '+(rm.length>1?'they are':'it is')+' still in the Strong range.':' The most room to grow is in '+rn+'.')+rm.map(line).join('');
    if(r.strong.length>2||r.room.length>2)s+=' More areas score the same as these, so start with the one that matters most to you.';
  }
  return s+' This reflects the habits you chose for a typical working day and week.';
}
/*ENDCORE*/

var S={step:'intro',qi:0,ans:{},opts:{},anim:false,name:''};
var timer=null;
function $(i){return document.getElementById(i)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function newRun(){S.ans={};S.opts={};Q.forEach(function(q){S.opts[q.id]=shuffle(q.o)});S.qi=0}
function names(list){return list.map(function(x){return x.a.name}).join(' · ')}

function vIntro(){
  return '<div class="intro fade"><span class="kick">Mind.OS · Getting Things Done</span><h1>Productivity assessment</h1>'+
  '<p class="statement">A quick look at how you manage your day and your week. Choose what you actually do, not what you think you should do. This is a starting point for reflection.</p>'+
  '<div class="facts"><span>10 situations</span><span>About 3 minutes</span><span>No right answers</span></div>'+
  '<div class="namebox"><label for="nm">Your name</label><input id="nm" type="text" maxlength="40" autocomplete="off" placeholder="Type your name" value="'+esc(S.name)+'"></div>'+
  '<button class="primary" data-act="start">Start</button>'+
  '<p class="tiny">Your answers stay on your screen and are not saved or sent.</p></div>';
}
function vQ(){
  var q=Q[S.qi],cur=S.ans[q.id];
  var o=S.opts[q.id].map(function(x,i){return '<button type="button" data-v="'+x[1]+'" class="'+(cur===x[1]?'on':'')+'">'+esc(x[0])+'</button>'}).join('');
  return '<div class="qwrap fade"><div class="pmeta"><span>Situation '+(S.qi+1)+' of 10</span><span>Your typical day and week</span></div>'+
  '<div class="prog"><i style="width:'+(S.qi/10*100)+'%"></i></div>'+
  '<div class="card"><p class="scene">'+esc(q.q)+'</p><div class="opts">'+o+'</div>'+
  '<div class="nav"><button class="link m" data-act="back">Back</button><span class="keys">Press 1 to 4 to choose</span>'+(typeof cur==='number'?'<button class="link" data-act="next">Next</button>':'<span></span>')+'</div></div></div>';
}
function vResult(){
  var r=score(S.ans),C=339.29,off=C*(1-r.pct/100);
  var rows=r.areas.map(function(x){var w=x.pts/6*100;
    return '<div class="area"><span class="nm"><span class="dot" style="background:'+x.a.hex+'"></span>'+x.a.name+'</span><div class="trk"><b data-w="'+w+'" style="background:'+x.a.hex+';width:0"></b></div><span class="bd">'+x.band+'</span></div>'}).join('');
  var stand,exps='';
  if(r.balanced){stand='<div class="two"><div class="stand" style="--c:#3DCD58"><div class="h3s">What stands out</div><p>Your five areas are evenly balanced.</p></div></div>';
    exps='<div class="exp"><b>Try this week</b>Pick the area that matters most to you right now, and try its small experiment: '+esc(r.areas[0].a.exp)+'</div>'}
  else{
    stand='<div class="two"><div class="stand" style="--c:#3DCD58"><div class="h3s">Your strongest area'+(r.strong.length>1?'s':'')+'</div><p>'+esc(names(r.strong))+'</p></div>'+
    '<div class="stand" style="--c:#F2C230"><div class="h3s">Most room to grow</div><p>'+esc(names(r.room))+'</p></div></div>';
    exps=r.room.slice(0,2).map(function(x){return '<div class="exp"><b>Try this week: '+esc(x.a.name)+'</b>'+esc(x.a.exp)+'</div>'}).join('');
    if(r.room.length>2)exps+='<p class="mute" style="margin-top:8px;font-size:14px">Several areas share the most room. Start with the one that matters most to you.</p>';
  }
  return '<div class="fade"><div class="bar noprint"><button class="link m" data-act="edit">Edit my answers</button><button class="link m" data-act="restart">Start again</button></div>'+
  '<span class="kick">Your result</span><h1 class="rtitle">'+(S.name?esc(S.name)+"’s productivity assessment":'Your productivity assessment')+'</h1>'+
  '<div class="card"><div class="top"><div class="ringwrap"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/><circle id="ring" class="ring-fg" cx="60" cy="60" r="54" fill="none" stroke="#3DCD58" stroke-width="10" stroke-linecap="round" style="stroke-dashoffset:'+C+'" data-off="'+off+'"/></svg>'+
  '<div class="pct" role="img" aria-label="'+r.pct+' percent"><div><b id="pctn">'+r.pct+'%</b><small>productivity</small></div></div></div>'+
  '<div><span class="band">'+r.band+'</span><h2>Your productivity: '+r.pct+'%</h2><p class="mute">Based on the habits you reported for a typical working day and week.</p></div></div>'+
  '<div class="why"><div class="h3s">Why this result</div><p>'+esc(explain(S.ans))+'</p></div></div>'+
  '<div class="card" style="margin-top:16px"><div class="h3s">Your five areas</div><div class="areas">'+rows+'</div></div>'+
  '<div style="margin-top:16px">'+exps+'</div>'+
  '<p class="foot">This is a snapshot of the habits you reported, not a measure of how good you are at your job or in life. Some of these areas depend on your team, role and circumstances, not only on you. The percentage is the share of the 30 possible points you scored. Your answers stay on your screen and are not saved or sent.</p></div>';
}
function draw(){
  $('app').innerHTML=S.step==='intro'?vIntro():S.step==='q'?vQ():vResult();
  if(S.step==='result'){
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){
      var ring=$('ring');if(ring)ring.style.strokeDashoffset=ring.getAttribute('data-off');
      [].forEach.call(document.querySelectorAll('.trk b'),function(b){b.style.width=b.getAttribute('data-w')+'%'});
    },reduce?0:60);
  }
  window.scrollTo(0,0);
}
function go(s){S.step=s;draw()}
function next(){if(S.qi<9){S.qi++;draw()}else go('result')}
$('app').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-v')){
    S.ans[Q[S.qi].id]=+b.getAttribute('data-v');
    [].forEach.call(document.querySelectorAll('.opts button'),function(x){x.classList.toggle('on',x===b)});
    clearTimeout(timer);timer=setTimeout(next,260);return;
  }
  var act=b.getAttribute('data-act');
  if(act==='start'){newRun();go('q')}
  else if(act==='next'){clearTimeout(timer);next()}
  else if(act==='back'){clearTimeout(timer);if(S.qi>0){S.qi--;draw()}else go('intro')}
  else if(act==='edit'){S.qi=0;go('q')}
  else if(act==='restart'){S.ans={};go('intro')}
});
$('app').addEventListener('input',function(e){if(e.target.id==='nm')S.name=e.target.value.trim()});
document.addEventListener('keydown',function(e){
  if(S.step==='intro'&&e.key==='Enter'&&e.target&&e.target.id==='nm'){newRun();go('q');return}
  if(S.step!=='q')return;var n=+e.key;
  if(n>=1&&n<=4){var b=document.querySelectorAll('.opts button')[n-1];if(b)b.click()}
});
draw();
</script>
